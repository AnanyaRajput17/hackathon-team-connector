<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Team Chat | Hackathon Connector</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
/* Lock window constraints completely to isolate panel scroll structures */
html, body {
    height: 100vh;
    overflow: hidden;
}

.chat-layout {
    display: flex; 
    flex-direction: column;
    height: 100vh;
    padding-top: var(--nav-h);
    overflow: hidden;
}

.chat-header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
}
.chat-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }
.chat-subtitle { font-size: 13px; color: var(--muted); }

/* Independent internal scrolling channel container strictly configured for incoming text lines */
.messages-area {
    flex: 1; 
    overflow-y: auto;
    padding: 24px;
    display: flex; 
    flex-direction: column; 
    gap: 12px;
    scroll-behavior: smooth;
    max-height: calc(100vh - var(--nav-h) - 80px);
}

.message {
    display: flex; gap: 10px; max-width: 70%;
    animation: msgIn 0.2s ease;
}
@keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
}
.message.mine { flex-direction: row-reverse; align-self: flex-end; }
.msg-avatar {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: white;
}
.msg-avatar.mine { background: linear-gradient(135deg, var(--accent2), #ff9eb0); }
.msg-body { }
.msg-sender { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.message.mine .msg-sender { text-align: right; }
.msg-bubble {
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.5;
    word-break: break-word;
}
.message:not(.mine) .msg-bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
}
.message.mine .msg-bubble {
    background: var(--accent);
    color: white;
    border-top-right-radius: 4px;
}
.msg-time { font-size: 11px; color: var(--muted); margin-top: 4px; }
.message.mine .msg-time { text-align: right; }

.chat-input-area {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    display: flex; gap: 12px; align-items: flex-end;
    flex-shrink: 0;
}
.chat-input {
    flex: 1;
    padding: 12px 16px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    resize: none;
    max-height: 120px;
    transition: border-color 0.2s;
}
.chat-input:focus { border-color: var(--accent); }
.send-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
}
.send-btn:hover { background: #8d7cff; transform: scale(1.05); }
.send-btn:disabled { opacity: 0.5; transform: none; cursor: not-allowed; }
.day-separator {
    text-align: center;
    color: var(--muted); font-size: 12px;
    display: flex; align-items: center; gap: 12px;
}
.day-separator::before, .day-separator::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
}
.ws-status {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--muted); margin-left: auto;
}
.ws-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
}
.ws-dot.connected { background: var(--success); }
</style>
</head>
<body>
<nav>
    <a href="hackathons.html" class="nav-brand">🏆 HackConnect</a>
    <div class="nav-links">
        <a href="hackathons.html" class="nav-link">Hackathons</a>
        <a href="teams.html" class="nav-link active">Teams</a>
        <a href="requests.html" class="nav-link">Requests</a>
        <a href="profile.html" class="nav-link">Profile</a>
    </div>
    <div class="nav-right">
        <div class="nav-user">
            <div class="nav-avatar" id="navAvatar">?</div>
            <span id="navName"></span>
        </div>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="chat-layout">
    <div class="chat-header">
        <button class="btn btn-secondary btn-sm" onclick="history.back()">←</button>
        <div>
            <div class="chat-title" id="chatTitle">Team Chat</div>
            <div class="chat-subtitle" id="chatSubtitle">Loading...</div>
        </div>
        <div class="ws-status" id="wsStatus">
            <div class="ws-dot" id="wsDot"></div>
            <span id="wsLabel">Connecting...</span>
        </div>
    </div>

    <div class="messages-area" id="messagesArea">
        <div class="loading-state"><div class="spinner"></div> Loading messages...</div>
    </div>

    <div class="chat-input-area">
        <textarea class="chat-input" id="chatInput" placeholder="Type a message..."
            rows="1" onkeypress="handleKey(event)"
            oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<script src="api.js"></script>
<script>
if (!getToken()) window.location.href = 'index.html';

const user = getUser();
const params = new URLSearchParams(window.location.search);
const teamId = params.get('teamId');
const teamName = decodeURIComponent(params.get('teamName') || 'Team Chat');

if (!teamId) window.location.href = 'teams.html';

if (user) {
    document.getElementById('navAvatar').textContent = user.name?.[0]?.toUpperCase() || '?';
    document.getElementById('navName').textContent = user.name;
}

document.getElementById('chatTitle').textContent = '💬 ' + teamName;
document.getElementById('chatSubtitle').textContent = 'Team #' + teamId;

function logout() { clearAuth(); window.location.href = 'index.html'; }

function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function formatTime(dateStr) {
    if (!dateStr) return '';
    return new Date(dateStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function createMessageEl(msg) {
    const isMe = msg.sender?.email === user?.email || msg.sender?.id === user?.id;
    const div = document.createElement('div');
    div.className = `message ${isMe ? 'mine' : ''}`;
    div.innerHTML = `
        <div class="msg-avatar ${isMe ? 'mine' : ''}">
            ${msg.sender?.name?.[0]?.toUpperCase() || '?'}
        </div>
        <div class="msg-body">
            ${!isMe ? `<div class="msg-sender">${msg.sender?.name || 'Unknown'}</div>` : ''}
            <div class="msg-bubble">${escapeHtml(msg.content)}</div>
            <div class="msg-time">${formatTime(msg.sentAt)}</div>
        </div>
    `;
    return div;
}

function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
}

function scrollToBottom() {
    const area = document.getElementById('messagesArea');
    area.scrollTop = area.scrollHeight;
}

function appendMessage(msg) {
    const area = document.getElementById('messagesArea');
    area.appendChild(createMessageEl(msg));
    scrollToBottom();
}

async function loadHistory() {
    try {
        const history = await Chat.getHistory(teamId);
        const area = document.getElementById('messagesArea');
        area.innerHTML = '';
        if (!history.length) {
            area.innerHTML = `<div class="empty-state">
                <div class="icon">💬</div>
                <h3>No messages yet</h3>
                <p>Be the first to say hello!</p>
            </div>`;
            return;
        }
        history.forEach(msg => area.appendChild(createMessageEl(msg)));
        scrollToBottom();
    } catch(e) {
        document.getElementById('messagesArea').innerHTML =
            `<div class="empty-state"><div class="icon">⚠️</div>
            <h3>Could not load messages</h3><p>${e.message}</p></div>`;
    }
}

// ─── WebSocket STOMP Endpoint Connection ──────────────────────────
let stompClient = null;

function connectWebSocket() {
    const dot = document.getElementById('wsDot');
    const label = document.getElementById('wsLabel');

    stompClient = new StompJs.Client({
        // Updated to use matching 127.0.0.1 loopback notation mapping target filters
        brokerURL: 'ws://127.0.0.1:8080/ws/websocket',
        connectHeaders: { Authorization: `Bearer ${getToken()}` },
        reconnectDelay: 5000,
        onConnect: () => {
            dot.classList.add('connected');
            label.textContent = 'Connected';

            stompClient.subscribe(`/topic/team/${teamId}`, (msg) => {
                const message = JSON.parse(msg.body);
                const area = document.getElementById('messagesArea');
                const emptyState = area.querySelector('.empty-state');
                if (emptyState) emptyState.remove();
                appendMessage(message);
            });
        },
        onDisconnect: () => {
            dot.classList.remove('connected');
            label.textContent = 'Disconnected';
        },
        onStompError: () => {
            dot.classList.remove('connected');
            label.textContent = 'Connection error';
        }
    });

    stompClient.activate();
}

async function sendMessage() {
    const input = document.getElementById('chatInput');
    const content = input.value.trim();
    if (!content) return;

    const btn = document.getElementById('sendBtn');
    btn.disabled = true;

    try {
        if (stompClient?.connected) {
            stompClient.publish({
                destination: `/app/chat.send/${teamId}`,
                body: JSON.stringify({ content }),
                headers: { Authorization: `Bearer ${getToken()}` }
            });
        } else {
            const saved = await Chat.saveMessage ?
                Chat.saveMessage(teamId, content) :
                await api(`/api/chat/${teamId}/send`, {
                    method: 'POST',
                    body: JSON.stringify({ content })
                });
            appendMessage(saved);
        }
        input.value = '';
        input.style.height = 'auto';
    } catch(e) {
        console.error('Send failed', e);
    } finally {
        btn.disabled = false;
        input.focus();
    }
}

loadHistory();
connectWebSocket();
</script>
</body>
</html>
