<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hackathon Connector — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --card: #1a1a24;
    --border: #2a2a3a;
    --accent: #7c6aff;
    --accent2: #ff6a8a;
    --text: #f0f0f8;
    --muted: #8888aa;
    --success: #4ade80;
    --error: #ff6a8a;
}

body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
}

/* Animated background */
.bg-orbs {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
}
.orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.15;
    animation: float 8s ease-in-out infinite;
}
.orb1 { width: 500px; height: 500px; background: var(--accent); top: -100px; left: -100px; animation-delay: 0s; }
.orb2 { width: 400px; height: 400px; background: var(--accent2); bottom: -100px; right: -100px; animation-delay: 3s; }
.orb3 { width: 300px; height: 300px; background: #4ade80; top: 50%; left: 50%; animation-delay: 6s; }

@keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(30px, -30px) scale(1.05); }
    66% { transform: translate(-20px, 20px) scale(0.95); }
}

.container {
    position: relative; z-index: 1;
    width: 100%; max-width: 440px;
    padding: 16px;
}

.logo {
    text-align: center;
    margin-bottom: 32px;
}
.logo-icon {
    font-size: 48px;
    display: block;
    margin-bottom: 8px;
    animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
}
.logo h1 {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}
.logo p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 4px;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px;
    backdrop-filter: blur(20px);
    box-shadow: 0 32px 64px rgba(0,0,0,0.4);
}

/* Tabs */
.tabs {
    display: flex;
    background: var(--surface);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 28px;
}
.tab {
    flex: 1;
    padding: 10px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.25s;
}
.tab.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 4px 16px rgba(124,106,255,0.4);
}

/* Form */
.form-panel { display: none; }
.form-panel.active { display: block; }

.form-group { margin-bottom: 18px; }
label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
}
input {
    width: 100%;
    padding: 14px 16px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
}
input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,106,255,0.15);
}
input::placeholder { color: var(--muted); }

.btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
    margin-top: 8px;
    letter-spacing: 0.02em;
}
.btn-primary {
    background: linear-gradient(135deg, var(--accent), #9c7cff);
    color: white;
    box-shadow: 0 8px 24px rgba(124,106,255,0.35);
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(124,106,255,0.5);
}
.btn-primary:active { transform: translateY(0); }
.btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none !important; }

.alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 16px;
    display: none;
}
.alert.error { background: rgba(255,106,138,0.15); border: 1px solid rgba(255,106,138,0.3); color: var(--error); }
.alert.success { background: rgba(74,222,128,0.15); border: 1px solid rgba(74,222,128,0.3); color: var(--success); }
.alert.show { display: block; }

.spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 8px;
    vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<div class="container">
    <div class="logo">
        <span class="logo-icon">🏆</span>
        <h1>Hackathon Connector</h1>
        <p>Find your dream team, build the future</p>
    </div>

    <div class="card">
        <div class="tabs">
            <button class="tab active" onclick="switchTab('login')">Login</button>
            <button class="tab" onclick="switchTab('register')">Register</button>
        </div>

        <!-- Login Form -->
        <div class="form-panel active" id="loginPanel">
            <div class="alert error" id="loginError"></div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="you@college.com"/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••"
                    onkeypress="if(event.key==='Enter') doLogin()"/>
            </div>
            <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">
                Login to Account
            </button>
        </div>

        <!-- Register Form -->
        <div class="form-panel" id="registerPanel">
            <div class="alert error" id="registerError"></div>
            <div class="alert success" id="registerSuccess"></div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="regName" placeholder="John Doe"/>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="regEmail" placeholder="you@college.com"/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword" placeholder="Min 6 characters"/>
            </div>
            <div class="form-group">
                <label>College Name</label>
                <input type="text" id="regCollege" placeholder="ABC Engineering College"/>
            </div>
            <button class="btn btn-primary" id="registerBtn" onclick="doRegister()">
                Create Account
            </button>
        </div>
    </div>
</div>

<script src="api.js"></script>
<script>
// Redirect if already logged in
if (getToken() && getUser()) {
    window.location.href = 'hackathons.html';
}

function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
    });
    document.getElementById('loginPanel').classList.toggle('active', tab === 'login');
    document.getElementById('registerPanel').classList.toggle('active', tab === 'register');
}

function showError(id, msg) {
    const el = document.getElementById(id);
    el.textContent = '⚠️ ' + msg;
    el.classList.add('show');
    el.className = el.className.replace('success', 'error') + ' show';
}
function showSuccess(id, msg) {
    const el = document.getElementById(id);
    el.textContent = '✅ ' + msg;
    el.classList.add('show');
}
function hideAlert(id) {
    document.getElementById(id).classList.remove('show');
}

async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const btn = document.getElementById('loginBtn');

    if (!email || !password) return showError('loginError', 'Please fill all fields');
    hideAlert('loginError');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Logging in...';

    try {
        const res = await Auth.login({ email, password });
        setAuth(res.token, res.user);
        window.location.href = 'hackathons.html';
    } catch (err) {
        showError('loginError', err.message || 'Invalid credentials');
        btn.disabled = false;
        btn.innerHTML = 'Login to Account';
    }
}

async function doRegister() {
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const college = document.getElementById('regCollege').value.trim();
    const btn = document.getElementById('registerBtn');

    if (!name || !email || !password || !college)
        return showError('registerError', 'Please fill all fields');
    if (password.length < 6)
        return showError('registerError', 'Password must be at least 6 characters');
    hideAlert('registerError');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Creating account...';

    try {
        const res = await Auth.register({ name, email, password, college });
        setAuth(res.token, res.user);
        showSuccess('registerSuccess', 'Account created! Redirecting...');
        setTimeout(() => window.location.href = 'hackathons.html', 1000);
    } catch (err) {
        showError('registerError', err.message || 'Registration failed');
        btn.disabled = false;
        btn.innerHTML = 'Create Account';
    }
}
</script>
</body>
</html>
